backend:
  name: github
  repo: The-AgenticFlow/openflows-website
  branch: master
  base_url: https://openflows-oauth-proxy.yemelechristian2.workers.dev
  auth_endpoint: auth

# Every change becomes a pull request: Draft, In review, Ready, then merged.
publish_mode: editorial_workflow

# Branding shown in the editor.
app_title: OpenFlows Content
site_url: https://openflows.dev
display_url: https://openflows.dev
logo:
  src: /openlogo-transparent.png

# Keep frontmatter tidy: leave out optional fields that are empty, and give
# uploaded files URL-safe names.
output:
  omit_empty_optional_fields: true
media_libraries:
  default:
    config:
      slugify_filename: true

media_folder: "public/uploads"
public_folder: "/uploads"

slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: "blogs"
    icon: "edit_note"
    label: "Blog posts"
    label_singular: "Blog post"
    description: "Articles on /blog. Each change is reviewed before it goes live."
    folder: "src/content/blogs"
    thumbnail: cover_image_url
    summary: "{{title}}"
    table_columns:
      - { field: title, label: "Title" }
      - { field: category_id, label: "Category" }
      - { field: author_name, label: "Author" }
      - { field: status, label: "Status" }
      - { field: published_at, label: "Published" }
    sortable_fields:
      - { field: "published_at", label: "Date", default_sort: "desc" }
      - "title"
      - "category_id"
    view_filters:
      - { label: "Published", field: status, pattern: "published" }
      - { label: "Drafts", field: status, pattern: "draft" }
      - { label: "Featured", field: is_featured, pattern: true }
    view_groups:
      - { label: "Category", field: category_id }
      - { label: "Year", field: published_at, pattern: "\\d{4}" }
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "The headline of the post." }
      - { label: "Web address", name: "slug", widget: "string", hint: "The last part of the link, lowercase with dashes, for example 'planning-gates-explained' gives openflows.dev/blog/planning-gates-explained. Do not change it after publishing." }
      - { label: "Teaser", name: "excerpt", widget: "text", hint: "One or two sentences shown on the blog list, in search and in link previews." }
      - label: "Author"
        name: "author_name"
        widget: "relation"
        collection: "authors"
        search_fields: ["name"]
        value_field: "name"
        display_fields: ["name"]
        hint: "Pick the author. Their photo comes from their profile under Authors; add the person there first if they are not listed."
      - { label: "Cover image", name: "cover_image_url", widget: "image", required: false, hint: "Upload an image or paste an image link. Wide images (about 1600 × 900) look best." }
      - { label: "Category", name: "category_id", widget: "string", required: false, hint: "One short topic, for example Architecture. It becomes a filter on the blog page." }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["published", "draft", "archived"]
        default: "published"
        hint: "Visibility on the website. Defaults to published because the CMS workflow (Draft, Ready, Publish now) already gates when a post goes live. Choose draft or archived to keep a post hidden even after it is merged."
      - { label: "Publish date", name: "published_at", widget: "datetime", required: false, hint: "Shown on the post and used to order the blog, newest first." }
      - { label: "Featured", name: "is_featured", widget: "boolean", default: false, hint: "Marks the post as featured. The website does not use this yet." }
      - { label: "Reading time (minutes)", name: "read_time_minutes", widget: "number", required: false, hint: "Optional. Leave empty to calculate it from the text." }
      - { label: "Post content", name: "body", widget: "markdown" }

  - name: "research"
    icon: "science"
    label: "Research papers"
    label_singular: "Research paper"
    description: "Papers and technical reports on /research."
    folder: "src/content/research"
    summary: "{{title}}"
    table_columns:
      - { field: title, label: "Title" }
      - { field: category, label: "Category" }
      - { field: publish_date, label: "Published" }
    sortable_fields:
      - { field: "publish_date", label: "Date", default_sort: "desc" }
      - "title"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", required: false }
      - { label: "Abstract", name: "abstract", widget: "text" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Publish Date", name: "publish_date", widget: "datetime" }
      - { label: "Venue", name: "venue", widget: "string", required: false }
      - { label: "PDF URL", name: "pdf_url", widget: "string", required: false }
      - { label: "Cover Image URL", name: "cover_image_url", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - label: "Authors"
        name: "authors"
        widget: "list"
        required: false
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Affiliation", name: "affiliation", widget: "string", required: false }
      - { label: "Content", name: "body", widget: "markdown" }

