local_backend:
  url: http://localhost:8082/api/v1

backend:
  name: github
  repo: The-AgenticFlow/openflows-website
  branch: master
  base_url: https://openflows-oauth-proxy.yemelechristian2.workers.dev
  auth_endpoint: auth

publish_mode: editorial_workflow

# Branding shown in the editor.
site_url: https://openflows.dev
display_url: https://openflows.dev
logo_url: /openlogo-light.png

media_folder: "public/uploads"
public_folder: "/uploads"

slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: "blogs"
    label: "Blog posts"
    label_singular: "Blog post"
    description: "Engineering essays shown on /blog. New posts go through Workflow: Draft, In review, Ready, then Publish."
    folder: "src/content/blogs"
    summary: "{{title}}  ·  {{published_at | date('MMM D, YYYY')}}  ·  {{category_id}}"
    sortable_fields:
      - { field: "published_at", label: "Date", default_sort: "desc" }
      - "title"
      - "category_id"
    view_filters:
      - { label: "Published", field: status, pattern: "published" }
      - { label: "Drafts", field: status, pattern: "draft" }
      - { label: "Featured", field: is_featured, pattern: true }
    view_groups:
      - { label: "Category", field: category_id }
      - { label: "Year", field: published_at, pattern: "\\d{4}" }
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - label: "Author"
        name: "author_name"
        widget: "relation"
        collection: "authors"
        search_fields: ["name"]
        value_field: "name"
        display_fields: ["name"]
        hint: "Pick the author. Their photo comes from their profile under Authors; add the person there first if they are not listed."
      - { label: "Cover Image URL", name: "cover_image_url", widget: "string", required: false }
      - { label: "Category", name: "category_id", widget: "string", required: false, hint: "One short topic, for example Architecture. It becomes a filter on the blog page." }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["published", "draft", "archived"]
        default: "published"
        hint: "Visibility on the website. Defaults to published because the CMS workflow (Draft, Ready, Publish now) already gates when a post goes live. Choose draft or archived to keep a post hidden even after it is merged."
      - { label: "Published At", name: "published_at", widget: "datetime", required: false }
      - { label: "Featured", name: "is_featured", widget: "boolean", default: false }
      - { label: "Read Time (minutes)", name: "read_time_minutes", widget: "number", required: false }
      - { label: "Content", name: "body", widget: "markdown" }

  - name: "research"
    label: "Research papers"
    label_singular: "Research paper"
    description: "Papers and technical reports shown on /research."
    folder: "src/content/research"
    summary: "{{title}}  ·  {{publish_date | date('MMM D, YYYY')}}"
    sortable_fields:
      - { field: "publish_date", label: "Date", default_sort: "desc" }
      - "title"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", required: false }
      - { label: "Abstract", name: "abstract", widget: "text" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Publish Date", name: "publish_date", widget: "datetime" }
      - { label: "Venue", name: "venue", widget: "string", required: false }
      - { label: "PDF URL", name: "pdf_url", widget: "string", required: false }
      - { label: "Cover Image URL", name: "cover_image_url", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - label: "Authors"
        name: "authors"
        widget: "list"
        required: false
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Affiliation", name: "affiliation", widget: "string", required: false }
      - { label: "Content", name: "body", widget: "markdown" }

  - name: "stories"
    label: "Case studies"
    label_singular: "Case study"
    description: "Stories from teams using OpenFlows, shown on /resources."
    folder: "src/content/stories"
    summary: "{{title}}"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Date", name: "date", widget: "string", required: false }
      - { label: "URL", name: "href", widget: "string", required: false }
      - { label: "Image URL", name: "image", widget: "string", required: false }
      - { label: "Content", name: "body", widget: "markdown" }

  - name: "docs-introduction"
    label: "Introduction"
    label_singular: "Introduction page"
    description: "Pages in the Introduction section of /docs. Order sets the position in the sidebar; index is the section overview."
    folder: "src/content/docs/introduction"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{order}}.  {{title}}"
    sortable_fields:
      - { field: "order", label: "Order", default_sort: "asc" }
      - "title"
    editor: { preview: false }
    fields:
      - { label: "Section", name: "section", widget: "hidden", default: "Introduction" }
      - { label: "Title", name: "title", widget: "string", hint: "The page heading." }
      - { label: "Sidebar label", name: "nav_label", widget: "string", required: false, hint: "Shorter name for the sidebar. Leave empty to use the title." }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 50, hint: "Position in the sidebar: lower comes first. The overview page uses 0." }
      - { label: "Description", name: "description", widget: "text", required: false, hint: "One or two sentences shown under the title and in search results." }
      - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false, hint: "Optional small label above the title." }
      - { label: "Read time", name: "read_time", widget: "string", required: false, hint: "Optional, for example ~10 min read." }
      - { label: "Level", name: "level", widget: "select", required: false, options: ["Beginner", "Intermediate", "Advanced"] }
      - { label: "Hide from sidebar", name: "hidden", widget: "boolean", required: false, default: false, hint: "Keeps the page online but out of the sidebar and search." }
      - { label: "Content", name: "body", widget: "markdown", hint: "Write in Markdown. Extras: a callout is a quote starting with [!TIP], [!INFO] or [!WARNING] and a title, for example '> [!TIP] Good to know'. A numbered step is a heading like '## 1. Install'. Link cards go in a ```cards block, one '- [Title](/docs/page): description' per line. A diagram goes in a ```mermaid block. Use the + menu to insert these." }

