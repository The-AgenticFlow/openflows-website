local_backend:
  url: http://localhost:8082/api/v1

backend:
  name: github
  repo: The-AgenticFlow/openflows-website
  branch: master
  base_url: https://openflows-oauth-proxy.yemelechristian2.workers.dev
  auth_endpoint: auth

publish_mode: editorial_workflow

media_folder: "public/uploads"
public_folder: "/uploads"

slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: "authors"
    label: "Authors"
    label_singular: "Author"
    folder: "src/content/authors"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    identifier_field: "name"
    summary: "{{name}}"
    fields:
      - { label: "Name", name: "name", widget: "string", hint: "Shown on posts exactly as written here." }
      - { label: "Photo", name: "avatar", widget: "image", required: false, hint: "Square photo, at least 200 px wide. Leave empty to use the GitHub photo below, or initials." }
      - { label: "GitHub username", name: "github", widget: "string", required: false, hint: "Optional. Uses their public GitHub photo when no photo is uploaded." }
      - { label: "Role", name: "role", widget: "string", required: false }

  - name: "blogs"
    label: "Blog Posts"
    folder: "src/content/blogs"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - label: "Author"
        name: "author_name"
        widget: "relation"
        collection: "authors"
        search_fields: ["name"]
        value_field: "name"
        display_fields: ["name"]
        hint: "Pick the author. Their photo comes from their profile under Authors; add the person there first if they are not listed."
      - { label: "Cover Image URL", name: "cover_image_url", widget: "string", required: false }
      - { label: "Category", name: "category_id", widget: "string", required: false }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["published", "draft", "archived"]
        default: "published"
        hint: "Controls visibility on the website. Choose draft or archived to hide this post even after it is published in the CMS."
      - { label: "Published At", name: "published_at", widget: "datetime", required: false }
      - { label: "Featured", name: "is_featured", widget: "boolean", default: false }
      - { label: "Read Time (minutes)", name: "read_time_minutes", widget: "number", required: false }
      - { label: "Content", name: "body", widget: "markdown" }

  - name: "research"
    label: "Research Papers"
    folder: "src/content/research"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", required: false }
      - { label: "Abstract", name: "abstract", widget: "text" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Publish Date", name: "publish_date", widget: "datetime" }
      - { label: "Venue", name: "venue", widget: "string", required: false }
      - { label: "PDF URL", name: "pdf_url", widget: "string", required: false }
      - { label: "Cover Image URL", name: "cover_image_url", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - label: "Authors"
        name: "authors"
        widget: "list"
        required: false
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Affiliation", name: "affiliation", widget: "string", required: false }
      - { label: "Content", name: "body", widget: "markdown" }

  - name: "stories"
    label: "Success Stories"
    folder: "src/content/stories"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Date", name: "date", widget: "string", required: false }
      - { label: "URL", name: "href", widget: "string", required: false }
      - { label: "Image URL", name: "image", widget: "string", required: false }
      - { label: "Content", name: "body", widget: "markdown" }
