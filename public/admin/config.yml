  - name: "site"
    label: "Site content"
    label_singular: "Site content"
    description: "Content that appears across the website, outside the blog and docs."
    files:
      - name: "faq"
        label: "FAQ"
        file: "src/data/faq.json"
        editor: { preview: false }
        description: "Questions on /faq and the homepage. Answers are short Markdown: **bold**, `code` and [links](/docs/...)."
        fields:
          - label: "Topics"
            name: "groups"
            widget: "list"
            summary: "{{fields.title}}"
            collapsed: true
            fields:
              - { label: "Topic", name: "title", widget: "string" }
              - { label: "Anchor", name: "id", widget: "string", required: false, hint: "Short id used in links, for example security. Leave empty to generate it from the topic." }
              - label: "Questions"
                name: "items"
                widget: "list"
                summary: "{{fields.question}}"
                collapsed: true
                fields:
                  - { label: "Question", name: "question", widget: "string" }
                  - { label: "Answer", name: "answer", widget: "text", hint: "Separate paragraphs with a blank line." }
                  - { label: "Anchor", name: "id", widget: "string", required: false, hint: "Used in links like /faq#anchor. Leave empty to generate it from the question." }
          - { label: "Shown on the homepage", name: "home", widget: "list", hint: "Anchors of the questions to show on the homepage, in order, separated by commas." }

  - name: "authors"
    label: "Authors"
    label_singular: "Author"
    description: "People who write on the site. Blog posts pick their author from this list."
    folder: "src/content/authors"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    identifier_field: "name"
    summary: "{{name}}"
    fields:
      - { label: "Name", name: "name", widget: "string", hint: "Shown on posts exactly as written here." }
      - { label: "Photo", name: "avatar", widget: "image", required: false, hint: "Square photo, at least 200 px wide. Leave empty to use the GitHub photo below, or initials." }
      - { label: "GitHub username", name: "github", widget: "string", required: false, hint: "Optional. Uses their public GitHub photo when no photo is uploaded." }
      - { label: "Role", name: "role", widget: "string", required: false }
