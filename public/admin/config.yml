    summary: "{{title}}"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Date", name: "date", widget: "string", required: false }
      - { label: "URL", name: "href", widget: "string", required: false }
      - { label: "Image URL", name: "image", widget: "string", required: false }
      - { label: "Content", name: "body", widget: "markdown" }

  - divider: true

  - name: "docs-introduction"
    icon: "info"
    label: "Introduction"
    label_singular: "Introduction page"
    description: "Docs pages in the Introduction section, listed in sidebar order."
    folder: "src/content/docs/introduction"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{title}}"
    table_columns:
      - { field: order, label: "#" }
      - { field: title, label: "Title" }
      - { field: nav_label, label: "Sidebar label" }
      - { field: level, label: "Level" }
    sortable_fields:
      - { field: "order", label: "Order", default_sort: "asc" }
      - "title"
    editor: { preview: false }
    fields:
      - { label: "Section", name: "section", widget: "hidden", default: "Introduction" }
      - { label: "Page title", name: "title", widget: "string", hint: "The big heading at the top of the page." }
      - { label: "Summary", name: "description", widget: "text", required: false, hint: "One or two sentences under the title. Also used in search results and link previews." }
      - { label: "Page content", name: "body", widget: "markdown", hint: "Use Insert → Callout box, Link cards or Diagram for special blocks. A heading written as '1. Install' becomes a numbered step. Full guide: openflows.dev/docs/contributing/editing-content" }
      - { label: "Position in the sidebar", name: "order", widget: "number", value_type: "int", default: 50, hint: "Lower numbers come first. The section's overview page uses 0 or 1." }
      - { label: "Short sidebar name", name: "nav_label", widget: "string", required: false, hint: "Optional. A shorter name for the sidebar, for example 'Quick Start'. Leave empty to use the page title." }
      - { label: "Label above the title", name: "eyebrow", widget: "string", required: false, hint: "Optional small capitals above the title, for example 'Quick start guide'." }
      - { label: "Reading time", name: "read_time", widget: "string", required: false, hint: "Optional, for example '~10 min read'." }
      - { label: "Level", name: "level", widget: "select", required: false, options: ["Beginner", "Intermediate", "Advanced"], hint: "Optional. Shown next to the reading time." }
      - { label: "Hide from the sidebar", name: "hidden", widget: "boolean", required: false, default: false, hint: "The page stays online at its address but is left out of the sidebar and search." }

