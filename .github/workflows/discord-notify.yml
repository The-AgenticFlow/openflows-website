name: Discord Content Notification

on:
  push:
    branches: [master]
    paths:
      - "src/content/blogs/**"
      - "src/content/research/**"
      - "src/content/stories/**"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new and updated content
        id: content
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMRT HEAD~1 HEAD \
            -- 'src/content/blogs/*.md' 'src/content/research/*.md' 'src/content/stories/*.md' || true)
          echo "changed<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send Discord notifications
        if: steps.content.outputs.changed != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_CONTENT_WEBHOOK }}
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "Processing: $file"

            # Determine content type, category, and color
            case "$file" in
              src/content/blogs/*)   TYPE="Blog Post";      CAT="blog";     COLOR=11146497  ;;
              src/content/research/*) TYPE="Research Paper"; CAT="research"; COLOR=6513505   ;;
              src/content/stories/*) TYPE="Success Story";  CAT="stories";  COLOR=16098827  ;;
              *) continue ;;
            esac

            # Parse frontmatter (flat key: value)
            read_title()    { awk 'BEGIN{FS=": "}/^title:/    {gsub(/^[" \t]+|[" \t]+$/,"",$2); print $2; exit}' "$1"; }
            read_slug()     { awk 'BEGIN{FS=": "}/^slug:/     {gsub(/^[" \t]+|[" \t]+$/,"",$2); print $2; exit}' "$1"; }
            read_author()   { awk 'BEGIN{FS=": "}/^author_name:/{gsub(/^[" \t]+|[" \t]+$/,"",$2); print $2; exit}' "$1"; }
            read_excerpt()  { awk 'BEGIN{FS=": "}/^excerpt:|^abstract:/{gsub(/^[" \t]+|[" \t]+$/,"",$2); print $2; exit}' "$1"; }

            TITLE=$(read_title "$file")
            SLUG=$(read_slug "$file")
            AUTHOR=$(read_author "$file")
            EXCERPT=$(read_excerpt "$file")

            [ -z "$TITLE" ] && TITLE="$(basename "$file" .md)"
            [ -z "$SLUG" ]  && SLUG="$(basename "$file" .md)"
            [ -z "$EXCERPT" ] && EXCERPT="New content published on OpenFlows."

            URL="https://openflows.dev/${CAT}/${SLUG}"

            # Build JSON payload with jq (handles special chars properly)
            PAYLOAD=$(jq -cn \
              --arg title "$TITLE" \
              --arg url "$URL" \
              --arg desc "$EXCERPT" \
              --argjson color "$COLOR" \
              --arg type "$TYPE" \
              --arg author "$AUTHOR" \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{
                username: "OpenFlows Publisher",
                avatar_url: "https://openflows.dev/openlogo.png",
                embeds: [{
                  title: $title,
                  url: $url,
                  description: $desc,
                  color: $color,
                  fields: ([
                    {name: "Type", value: $type, inline: true},
                    (if $author != "" then {name: "Author", value: $author, inline: true} else empty end)
                  ]),
                  footer: {text: "OpenFlows Content Published"},
                  timestamp: $ts
                }]
              }')

            # Send to Discord
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "$DISCORD_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "  ✓ Sent ($HTTP_CODE): $TITLE"
            else
              echo "  ✗ Discord returned $HTTP_CODE"
            fi

          done <<< "${{ steps.content.outputs.changed }}"
